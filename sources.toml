# ─────────────────────────────────────────────────────────────
#  Field Radar — where to look (all free, no keys)
#
#  type    = rss | crossref | gnews | arxiv | psyarxiv
#  kind    = what sort of evidence the source usually is:
#            peer-reviewed | preprint | research-news | industry |
#            practitioner | opinion | news | phd | cfp
#  hint    = (optional) interest id this source leans towards
#  filter  = true  → keep only items that match your keywords
#            false → keep everything (source is already on-topic)
#  enabled = false → switch a source off without deleting it
#  region  = (Google News only) "IN" for the Indian edition; default is global
#
#  To add a source: copy a block, change name/url, save.
# ─────────────────────────────────────────────────────────────


# ── PEER-REVIEWED JOURNALS (via Crossref, the DOI registry) ──
# New articles from the last `fetch_days`. Links go to the DOI.
[[sources]]
name = "Org Psych & OB journals"
type = "crossref"
kind = "peer-reviewed"
hint = "orgpsych"
filter = false
issns = [
  "0021-9010",  # Journal of Applied Psychology
  "0031-5826",  # Personnel Psychology
  "0894-3796",  # Journal of Organizational Behavior
  "0963-1798",  # Journal of Occupational and Organizational Psychology
  "1359-432X",  # European Journal of Work and Organizational Psychology
  "0001-4273",  # Academy of Management Journal
  "0749-5978",  # Organizational Behavior and Human Decision Processes
  "1048-9843",  # The Leadership Quarterly
  "0267-8373",  # Work & Stress
  "1076-8998",  # Journal of Occupational Health Psychology
  "0001-8791",  # Journal of Vocational Behavior
  "0889-3268",  # Journal of Business and Psychology
  "0269-994X",  # Applied Psychology: An International Review
  "1059-6011",  # Group & Organization Management
  "0018-7267",  # Human Relations
  "2041-3866",  # Organizational Psychology Review
]

[[sources]]
name = "L&D / HRD journals"
type = "crossref"
kind = "peer-reviewed"
hint = "lnd"
filter = false
issns = [
  "1044-8004",  # Human Resource Development Quarterly
  "1534-4843",  # Human Resource Development Review
  "1360-3736",  # International Journal of Training and Development
  "1537-260X",  # Academy of Management Learning & Education
  "1366-5626",  # Journal of Workplace Learning
  "2046-9012",  # European Journal of Training and Development
  "1350-5076",  # Management Learning
  "0090-4848",  # Human Resource Management
]

[[sources]]
name = "Behavioral science journals"
type = "crossref"
kind = "peer-reviewed"
hint = "behsci"
filter = true
issns = [
  "0894-3257",  # Journal of Behavioral Decision Making
  "2398-063X",  # Behavioural Public Policy
  "2397-3374",  # Nature Human Behaviour
  "0033-2909",  # Psychological Bulletin (meta-analyses)
]

[[sources]]
name = "HCI / UX journals"
type = "crossref"
kind = "peer-reviewed"
hint = "ux"
filter = true
issns = [
  "0747-5632",  # Computers in Human Behavior
  "1071-5819",  # International Journal of Human-Computer Studies
]


# ── PREPRINTS (new research, not yet peer-reviewed) ──
[[sources]]
name = "PsyArXiv"
type = "psyarxiv"
kind = "preprint"
filter = true

[[sources]]
name = "arXiv · Human-Computer Interaction"
type = "arxiv"
kind = "preprint"
hint = "ux"
filter = true
url = "http://export.arxiv.org/api/query?search_query=cat:cs.HC+OR+cat:cs.CY&sortBy=submittedDate&sortOrder=descending&max_results=150"


