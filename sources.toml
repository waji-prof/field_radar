# ── NEWS & REPORTS (Google News search — free RSS) ──
# `query` uses Google News search syntax. when:7d = last 7 days.
[[sources]]
name = "News · Workplace psychology"
type = "gnews"
kind = "news"
hint = "orgpsych"
filter = true
query = '("psychological safety" OR "employee engagement" OR "workplace wellbeing" OR "organizational psychology" OR "employee burnout") when:7d'

[[sources]]
name = "News · L&D and corporate training"
type = "gnews"
kind = "news"
hint = "lnd"
filter = true
query = '("learning and development" OR "corporate training" OR "leadership development" OR upskilling OR "instructional design") when:7d'

[[sources]]
name = "News · Future of work"
type = "gnews"
kind = "news"
hint = "fow"
filter = true
query = '("future of work" OR "Gen Z employees" OR "Gen Z workers" OR "hybrid work" OR "return to office" OR "employee experience" OR "four-day week") when:7d'

[[sources]]
name = "News · Behavioral science"
type = "gnews"
kind = "news"
hint = "behsci"
filter = true
query = '("behavioral science" OR "behavioural science" OR "behavioral economics" OR "behavioural economics" OR "nudge theory" OR "behavioural insights" OR "behavior change" OR "behaviour change") -stocks -shares when:7d'

[[sources]]
name = "News · AI in HR and L&D"
type = "gnews"
kind = "news"
hint = "ai"
filter = true
query = '("AI" ("HR" OR "L&D" OR "corporate learning" OR "people analytics" OR "workforce")) when:7d'

[[sources]]
name = "Reports · Workforce research"
type = "gnews"
kind = "industry"
hint = "fow"
filter = true
query = '(Gallup OR CIPD OR SHRM OR Deloitte OR McKinsey OR "World Economic Forum" OR "Work Trend Index" OR "Workplace Learning Report") (report OR survey OR study) (employees OR workforce OR workplace) when:14d'


# ── INDIA: PROFESSION & POLICY (Google News, Indian edition) ──
[[sources]]
name = "India · NCAHP & psychology regulation"
type = "gnews"
region = "IN"
kind = "news"
hint = "india"
filter = true
query = '(NCAHP OR "National Commission for Allied and Healthcare Professions" OR "Rehabilitation Council of India" OR "psychologists" (regulation OR registration OR guidelines)) when:30d'

[[sources]]
name = "India · UGC, research & fellowships"
type = "gnews"
region = "IN"
kind = "news"
hint = "india"
filter = true
query = '((UGC (PhD OR regulations OR fellowship OR "assistant professor")) OR ICSSR OR PMRF OR "research fellowship" India) when:30d'

[[sources]]
name = "India · Workplace & mental health policy"
type = "gnews"
region = "IN"
kind = "news"
hint = "india"
filter = true
query = '(India ("mental health" OR wellbeing OR workplace OR employees OR "L&D") (policy OR guidelines OR report OR survey OR study)) when:14d'


# ── PhD & ACADEMIC OPPORTUNITIES ──
# EURAXESS / jobs.ac.uk / Academic Positions have no working RSS,
# so we find their official listings through Google News site search.
[[sources]]
name = "EURAXESS (EU official research jobs)"
type = "gnews"
kind = "phd"
hint = "research"
filter = false
query = 'site:euraxess.ec.europa.eu (PhD OR doctoral) (psychology OR behavioural OR behavioral OR organizational OR organisational OR "human resource" OR management OR learning) when:30d'

[[sources]]
name = "jobs.ac.uk PhDs"
type = "gnews"
kind = "phd"
hint = "research"
filter = false
query = 'site:jobs.ac.uk (PhD OR studentship) (psychology OR behavioural OR organisational OR "human resource" OR management OR education) when:30d'

[[sources]]
name = "Academic Positions"
type = "gnews"
kind = "phd"
hint = "research"
filter = false
query = 'site:academicpositions.com PhD (psychology OR "organizational" OR "behavioral" OR "human resource") when:30d'

[[sources]]
name = "News · Funded PhD calls"
type = "gnews"
kind = "phd"
hint = "research"
filter = false
query = '("PhD" OR "doctoral") ("fully funded" OR "Marie Curie" OR MSCA OR scholarship) (psychology OR "behavioural science" OR "organizational behavior" OR HRM OR "management") when:30d'


