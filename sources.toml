# ─────────────────────────────────────────────────────────────
#  Field Radar — where to look (all free, no keys)
#
#  type    = rss | crossref | gnews | arxiv | psyarxiv | osf | podcast |
#            youtube | academictransfer
#  kind    = what sort of evidence the source usually is:
#            peer-reviewed | preprint | research-news | industry |
#            practitioner | opinion | news | phd | cfp
#  hint    = (optional) interest id this source leans towards
#  filter  = true  → keep only items that match your keywords
#            false → keep everything (source is already on-topic)
#  enabled = false → switch a source off without deleting it
#  region  = (Google News only) "IN" for the Indian edition; default is global
#
#  base    = (videos/podcasts) extra points for hand-picked channels
#  To add a source: copy a block, change name/url, save.
# ─────────────────────────────────────────────────────────────


# ── PEER-REVIEWED JOURNALS (via Crossref, the DOI registry) ──
# New articles from the last `fetch_days`. Links go to the DOI.
[[sources]]
name = "Org Psych & OB journals"
type = "crossref"
kind = "peer-reviewed"
hint = "orgpsych"
filter = false
