# ─────────────────────────────────────────────────────────────
#  Field Radar — your settings
#  Edit this file in Notepad. Lines starting with # are notes.
#  After editing, run run_radar.bat again to see the effect.
# ─────────────────────────────────────────────────────────────

[settings]
days_back = 14            # how many days of items the dashboard shows
fetch_days = 10           # how far back to look when fetching journals/preprints
top_picks = 10            # how many "Top picks" to highlight
min_score = 6.0           # items scoring below this are hidden (raise it = less noise)
max_per_source = 15       # stops one busy news feed from flooding the dashboard
notify = true             # Windows pop-up notification after each run
open_dashboard = false    # open the dashboard in your browser after each run
keep_days = 90            # older items are removed from the local database
opportunity_days = 60     # PhD / conference listings stay visible this long
shorts_per_day = 20       # 📱 Shorts tab: at most this many new shorts per day
longform_per_day = 10     # 🎬 Long-form tab: at most this many new videos/podcasts per day
media_per_channel = 4     # per day, so one channel can't fill a tab
media_min_relevance = 2.0 # video titles are short, so the topic bar is lower than for articles
timezone_hours = 5.5      # India time, used to decide what counts as "today"
summarizer = "none"       # "none" = free extracted description. (Future: "ollama" or "claude")

# Optional: Crossref (journal database) asks callers to share a contact email
# for its "polite" lane. Leave empty to stay anonymous — it still works.
crossref_mailto = ""


